<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snappy Chess</title>

  <script type="module">
  import { Chess } from "https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm";

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #202124;
      font-family: Arial, sans-serif;
      padding: 16px;
    }

    .game {
      width: min(92vw, 560px);
    }

    #board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      width: 100%;
      aspect-ratio: 1;
      border: 4px solid #111;
      border-radius: 4px;
      overflow: hidden;
    }

    .square {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      border: none;
      padding: 0;
      cursor: pointer;
      position: relative;
      font-size: clamp(24px, 7vw, 52px);
      line-height: 1;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .light {
      background: #eeeed2;
    }

    .dark {
      background: #769656;
    }

    .selected {
      background: #f6f669 !important;
    }

    .legal::after {
      content: "";
      position: absolute;
      width: 25%;
      height: 25%;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.23);
    }

    .legal.capture::after {
      width: 85%;
      height: 85%;
      background: transparent;
      border: 5px solid rgba(0, 0, 0, 0.23);
    }

    .piece {
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,.2));
    }

    .white-piece {
      color: #fff;
      -webkit-text-stroke: 1px #222;
      text-shadow: 1px 1px 1px #222;
    }

    .black-piece {
      color: #181818;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    button.action {
      flex: 1;
      padding: 14px 10px;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #resign {
      background: #b83b3b;
      color: white;
    }

    #newGame {
      background: #769656;
      color: white;
    }

    button.action:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.action:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>
  <main class="game">
    <div id="board" aria-label="Chess board"></div>

    <div class="controls">
      <button id="resign" class="action">Resign</button>
      <button id="newGame" class="action">New Game</button>
    </div>
  </main>

  <script>
    const game = new Chess();

    const boardElement = document.getElementById("board");
    const resignButton = document.getElementById("resign");
    const newGameButton = document.getElementById("newGame");

    const PIECE_VALUES = {
      p: 1, n: 3, b: 3, r: 5, q: 9, k: 0
    };

    const CENTER_SQUARES = ["e4", "d4", "e5", "d5"];

    const PIECES = {
      w: { k: "♔", q: "♕", r: "♖", b: "♗", n: "♘", p: "♙" },
      b: { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" }
    };

    let selectedSquare = null;
    let legalTargets = [];
    let gameOver = false;
    let thinking = false;

    function squareDistance(a, b) {
      const df = Math.abs(a.charCodeAt(0) - b.charCodeAt(0));
      const dr = Math.abs(Number(a[1]) - Number(b[1]));
      return Math.max(df, dr);
    }

    function distanceToCenter(move) {
      return Math.min(
        ...CENTER_SQUARES.map(center => squareDistance(move.to, center))
      );
    }

    function applyMove(move) {
      return game.move({
        from: move.from,
        to: move.to,
        promotion: move.promotion || "q"
      });
    }

    function botMove() {
      const legalMoves = game.moves({ verbose: true });

      // Prefer immediate checkmate.
      for (const move of legalMoves) {
        applyMove(move);
        const isMate = game.isCheckmate();
        game.undo();

        if (isMate) return move;
      }

      let bestMove = null;
      let bestValue = -1;
      let lowestDistance = 99;
      let lowestDistanceMove = null;
      let lowestDistanceValue = -1;

      for (const move of legalMoves) {
        let moveValue = 0;

        const isCapture =
          move.flags.includes("c") || move.flags.includes("e");

        if (isCapture) {
          const capturedPiece = game.get(move.to);
          const movingPiece = game.get(move.from);

          if (capturedPiece && movingPiece) {
            const capturedValue = PIECE_VALUES[capturedPiece.type] || 0;
            const movingValue = PIECE_VALUES[movingPiece.type] || 0;

            applyMove(move);
            const isDefended = game.isAttacked(move.to, game.turn());
            game.undo();

            if (isDefended && movingValue > capturedValue) {
              continue;
            }

            moveValue += capturedValue - movingValue;
          }
        }

        const distance = distanceToCenter(move);
        const movingPiece = game.get(move.from);

        if (distance < lowestDistance && movingPiece?.type !== "r") {
          lowestDistance = distance;
          lowestDistanceMove = move;
          lowestDistanceValue = moveValue;
        }

        if (moveValue > bestValue) {
          bestValue = moveValue;
          bestMove = move;
        }
      }

      if (lowestDistanceMove &&
          lowestDistanceValue + 0.1 > bestValue) {
        bestMove = lowestDistanceMove;
      }

      if (bestMove) return bestMove;

      return legalMoves[Math.floor(Math.random() * legalMoves.length)];
    }

    function renderBoard() {
      boardElement.innerHTML = "";

      for (let rank = 8; rank >= 1; rank--) {
        for (let file = 0; file < 8; file++) {
          const square = String.fromCharCode(97 + file) + rank;
          const piece = game.get(square);
          const button = document.createElement("button");

          button.type = "button";
          button.className =
            "square " + ((rank + file) % 2 === 0 ? "light" : "dark");
          button.setAttribute("aria-label", square);

          if (square === selectedSquare) {
            button.classList.add("selected");
          }

          if (legalTargets.some(move => move.to === square)) {
            button.classList.add("legal");

            if (piece) button.classList.add("capture");
          }

          if (piece) {
            const span = document.createElement("span");
            span.className =
              "piece " + (piece.color === "w" ? "white-piece" : "black-piece");
            span.textContent = PIECES[piece.color][piece.type];
            button.appendChild(span);
          }

          button.addEventListener("click", () => onSquareClick(square));
          boardElement.appendChild(button);
        }
      }

      resignButton.disabled = gameOver;
    }

    function onSquareClick(square) {
      if (gameOver || thinking || game.turn() !== "w") return;

      const piece = game.get(square);

      if (selectedSquare) {
        const move = legalTargets.find(m => m.to === square);

        if (move) {
          const movingPiece = game.get(selectedSquare);
          const promotion =
            movingPiece?.type === "p" && square[1] === "8";

          const moveResult = game.move({
            from: selectedSquare,
            to: square,
            promotion: promotion ? "q" : undefined
          });

          selectedSquare = null;
          legalTargets = [];

          if (moveResult) {
            renderBoard();

            if (checkGameOver()) return;

            thinking = true;
            renderBoard();


			setTimeout(() => {
			  try {
				if (gameOver) return;

				const response = botMove();

				if (response) {
				  applyMove(response);
				}

			// Always release the board after Snappy's turn.
			selectedSquare = null;
			legalTargets = [];
			thinking = false;

			renderBoard();
			checkGameOver();
		  } catch (error) {
			console.error("Snappy's move failed:", error);
			thinking = false;
			renderBoard();
		  }
		}, 180);


            return;
          }
        }
      }

      if (piece && piece.color === "w") {
        selectedSquare = square;
        legalTargets = game.moves({
          square,
          verbose: true
        });
      } else {
        selectedSquare = null;
        legalTargets = [];
      }

      renderBoard();
    }

    function checkGameOver() {
      if (!game.isGameOver()) return false;

      gameOver = true;
      thinking = false;
      selectedSquare = null;
      legalTargets = [];
      renderBoard();

      if (game.isCheckmate()) {
        alert(
          game.turn() === "w"
            ? "Checkmate! Snappy wins."
            : "Checkmate! You win!"
        );
      } else if (game.isStalemate()) {
        alert("Draw by stalemate!");
      } else if (game.isDraw()) {
        alert("The game is a draw!");
      } else {
        alert("Game over!");
      }

      return true;
    }

    resignButton.addEventListener("click", () => {
      if (gameOver) return;

      if (confirm("Are you sure you want to resign?")) {
        gameOver = true;
        selectedSquare = null;
        legalTargets = [];
        renderBoard();
        alert("You resigned. Snappy wins!");
      }
    });

    newGameButton.addEventListener("click", () => {
      if (!gameOver && game.history().length > 0) {
        if (!confirm("Start a new game? Your current game will be lost.")) {
          return;
        }
      }

      game.reset();
      selectedSquare = null;
      legalTargets = [];
      gameOver = false;
      thinking = false;
      renderBoard();
    });

    renderBoard();
  </script>
</body>
</html>
