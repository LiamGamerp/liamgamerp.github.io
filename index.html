<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snappy Chess</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #202124;
      font-family: Arial, sans-serif;
      padding: 16px;
    }

    .game {
      width: min(92vw, 560px);
    }

    #board {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      width: 100%;
      aspect-ratio: 1;
      border: 4px solid #111;
      border-radius: 4px;
      overflow: hidden;
    }
		.piece-image {
	  display: block;
	  width: 100%;
	  height: 100%;
	  object-fit: contain;
	  position: relative;
	  z-index: 1;
	  pointer-events: none;
	  user-select: none;
	  -webkit-user-drag: none;
	}
    .square {
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 1;
      border: none;
      padding: 0;
      cursor: pointer;
      position: relative;
      font-size: clamp(24px, 7vw, 52px);
      line-height: 1;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .light {
      background: #eeeed2;
    }

    .dark {
      background: #769656;
    }

    .selected {
      background: #f6f669 !important;
    }

    .legal::after {
      content: "";
      position: absolute;
      width: 25%;
      height: 25%;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.23);
    }

    .legal.capture::after {
      width: 85%;
      height: 85%;
      background: transparent;
      border: 5px solid rgba(0, 0, 0, 0.23);
    }

    .piece {
      position: relative;
      z-index: 1;
      filter: drop-shadow(0 1px 1px rgba(0,0,0,.2));
    }

    .white-piece {
      color: #fff;
      -webkit-text-stroke: 1px #222;
      text-shadow: 1px 1px 1px #222;
    }

    .black-piece {
      color: #181818;
    }

    .controls {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }

    button.action {
      flex: 1;
      padding: 14px 10px;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #resign {
      background: #b83b3b;
      color: white;
    }

    #newGame {
      background: #769656;
      color: white;
    }

    button.action:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    button.action:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>
  <main class="game">
    <div id="board" aria-label="Chess board"></div>

	<div class="controls">
	  <button id="resign" class="action">Resign</button>
	  <button id="newGame" class="action">New Game</button>
	  <button id="copyPGN" class="action" hidden>Copy PGN/Share Game</button>
	</div>
  </main>

  <script type=module>
    import { Chess } from
    "https://cdn.jsdelivr.net/npm/chess.js@1.4.0/+esm";
    const game = new Chess();
	// Change these URLs to your own asset hosting locations.
	const ASSET_BASE_URL = "https://images.chesscomfiles.com/chess-themes/pieces/neo/300/";
	const SOUND_BASE_URL = "http://images.chesscomfiles.com/chess-themes/sounds/_MP3_/default/";

	function pieceImageUrl(color, type) {
	  const colorPrefix = color === "w" ? "w" : "b";
	  return `${ASSET_BASE_URL}${colorPrefix}${type}.png`;
	}

	const sounds = {
	  move: new Audio(`${SOUND_BASE_URL}move-self.mp3`),
	  capture: new Audio(`${SOUND_BASE_URL}capture.mp3`),
	  check: new Audio(`${SOUND_BASE_URL}move-check.mp3`),
	  gameover: new Audio(`${SOUND_BASE_URL}game-end.mp3`)
	};

	function playSound(name) {
	  const sound = sounds[name];
	  if (!sound) return;
	  sound.currentTime = 0;
	  sound.play().catch(() => {});
	}
    const boardElement = document.getElementById("board");
    const resignButton = document.getElementById("resign");
    const newGameButton = document.getElementById("newGame");
	const copyPGNButton = document.getElementById("copyPGN");

    const PIECE_VALUES = {
      p: 1, n: 3, b: 3, r: 5, q: 9, k: 1 //King is 1 to avoid division by 0
    };

    const CENTER_SQUARES = ["e4", "d4", "e5", "d5"];

    const PIECES = {
      w: { k: "♔", q: "♕", r: "♖", b: "♗", n: "♘", p: "♙" },
      b: { k: "♚", q: "♛", r: "♜", b: "♝", n: "♞", p: "♟" }
    };

    let selectedSquare = null;
    let legalTargets = [];
    let gameOver = false;
    let thinking = false;

    function squareDistance(a, b) {
      const df = Math.abs(a.charCodeAt(0) - b.charCodeAt(0));
      const dr = Math.abs(Number(a[1]) - Number(b[1]));
      return Math.min(df, dr);
    }

    function distanceToCenter(move) {
      return Math.min(
        ...CENTER_SQUARES.map(center => squareDistance(move.to, center))
      );
    }

    function applyMove(move) {
      return game.move({
        from: move.from,
        to: move.to,
        promotion: move.promotion || "q"
      });
    }

    function botMove() {
	  const stamp = Date.now()
      const legalMoves = game.moves({ verbose: true });
      for (const move of legalMoves) {
        applyMove(move);
        const isMate = game.isCheckmate();
        game.undo();

        if (isMate) return move;
      }
      let bestMove = null;
      let bestValue = -1;
      let lowestDistance = 99;
      let lowestDistanceMove = null;
      let lowestDistanceValue = -1;
      for (const move of legalMoves) {
        let moveValue = 0.0;

        const isCapture =
          move.flags.includes("c") || move.flags.includes("e");
		const movingPiece = game.get(move.from);
		const movingValue = PIECE_VALUES[movingPiece.type] || 0;
		const opponent = game.turn() === "w" ? "b" : "w";
		if (!isCapture) {
			applyMove(move);
			const isUnsafe = game.isAttacked(move.to, game.turn());
			game.undo();
			if (isUnsafe) {
				moveValue-=movingValue;
				continue;
			} else if (game.isAttacked(move.from, opponent)) {
					moveValue+=movingValue;
			}
			const distance = distanceToCenter(move);

			if (distance < lowestDistance && movingPiece?.type !== "k") {
			  lowestDistance = distance;
			  lowestDistanceMove = move;
			  lowestDistanceValue = moveValue;
			  }
			}
        else {
          const capturedPiece = game.get(move.to);

          if (capturedPiece && movingPiece) {
            const capturedValue = PIECE_VALUES[capturedPiece.type] || 0;

            applyMove(move);
            const isDefended = game.isAttacked(move.to, game.turn());
            game.undo();

            if (isDefended && movingValue > capturedValue) {
              continue;
            }
			if (isDefended) {
				const tradeValue = capturedValue - movingValue;
				moveValue += tradeValue;
				if (tradeValue >= 6 || tradeValue <= -3) {
					continue;
				}
			}
			else {
				moveValue += capturedValue;
				if (capturedValue >= 5) { 
					continue;
				}
			}
          }
        }
		const isPromotion = move && move.flags.includes('p')
		if (isPromotion) {
			moveValue+=9
		}
		else if (movingPiece.type == "p" && (move.from.endsWith('2') || move.from.endsWith('7'))) {
			moveValue+=0.2;
		}
		const currentMoveCount = game.moves({ verbose: true })	
		  .filter(m => m.from === move.from).length;
		applyMove(move);
		game._turn="b"
		const allLegalMoves = game.moves({ verbose: true });
		const isPawn = movingPiece.type == "p"
		const moveCount = (allLegalMoves.filter(
		  m => m.from === move.to
		).length) - ((currentMoveCount * !isPawn) + ((currentMoveCount / 4) * isPawn));
		game._turn="w"
		game.undo();

		moveValue += moveCount / movingValue;

        if (moveValue > bestValue) {
          bestValue = moveValue;
          bestMove = move;
        }
		console.log({
		  move: move.from + move.to,
		  isPawn,
		  moveValue
		});
      }
	  console.log("=".repeat(20))
	  console.log(Date.now() - stamp)
	  console.log("=".repeat(20))
      if (lowestDistanceMove &&
          lowestDistanceValue + 0 > bestValue) {
        bestMove = lowestDistanceMove;
      }

      if (bestMove) return bestMove;
      return legalMoves[Math.floor(Math.random() * legalMoves.length)];
    }


	function renderBoard() {
	  boardElement.innerHTML = "";

	  for (let rank = 8; rank >= 1; rank--) {
		for (let file = 0; file < 8; file++) {
		  const square = String.fromCharCode(97 + file) + rank;
		  const piece = game.get(square);
		  const button = document.createElement("button");

		  button.type = "button";
		  button.className =
			"square " + ((rank + file) % 2 === 0 ? "light" : "dark");
		  button.setAttribute("aria-label", square);

		  if (square === selectedSquare) {
			button.classList.add("selected");
		  }

		  if (legalTargets.some(move => move.to === square)) {
			button.classList.add("legal");
			if (piece) button.classList.add("capture");
		  }

		  if (piece) {
			const img = document.createElement("img");
			img.className = "piece-image";
			img.src = pieceImageUrl(piece.color, piece.type);
			img.alt =
			  `${piece.color === "w" ? "White" : "Black"} ${piece.type}`;
			img.draggable = false;

			img.onerror = () => {
			  console.error("Could not load chess piece:", img.src);
			  img.alt = "Image unavailable";
			};

			button.appendChild(img);
		  }

		  button.addEventListener("click", () => onSquareClick(square));
		  boardElement.appendChild(button);
		}
	  }

	  resignButton.disabled = gameOver;
	}


    function onSquareClick(square) {
      if (gameOver || thinking || game.turn() !== "w") return;

      const piece = game.get(square);

      if (selectedSquare) {
        const move = legalTargets.find(m => m.to === square);

        if (move) {
          const movingPiece = game.get(selectedSquare);
          const promotion =
            movingPiece?.type === "p" && square[1] === "8";

          const moveResult = game.move({
            from: selectedSquare,
            to: square,
            promotion: promotion ? "q" : undefined
          });

          selectedSquare = null;
          legalTargets = [];

		if (moveResult) {
		  playSound(
			moveResult.captured || moveResult.flags.includes("e")
			  ? "capture"
			  : "move"
		  );

		  renderBoard();

		  if (checkGameOver()) return;

            thinking = true;
            renderBoard();


			setTimeout(() => {
			  try {
				if (gameOver) return;

				const response = botMove();

		if (response) {
		  const isCapture =
			response.flags.includes("c") ||
			response.flags.includes("e");

		  applyMove(response);
		  playSound(isCapture ? "capture" : "move");
		}

			// Always release the board after Snappy's turn.
			selectedSquare = null;
			legalTargets = [];
			thinking = false;

			renderBoard();
			checkGameOver();
		  } catch (error) {
			console.error("Snappy's move failed:", error);
			thinking = false;
			renderBoard();
		  }
		}, 180);


            return;
          }
        }
      }

      if (piece && piece.color === "w") {
        selectedSquare = square;
        legalTargets = game.moves({
          square,
          verbose: true
        });
      } else {
        selectedSquare = null;
        legalTargets = [];
      }

      renderBoard();
    }

    function checkGameOver() {
      if (!game.isGameOver()) return false;

      gameOver = true;
	  playSound("gameover");
      thinking = false;
      selectedSquare = null;
      legalTargets = [];
      renderBoard();

      if (game.isCheckmate()) {
        alert(
          game.turn() === "w"
            ? "Checkmate! Snappy wins."
            : "Checkmate! You win!"
        );
      } else if (game.isStalemate()) {
        alert("Draw by stalemate!");
      } else if (game.isDraw()) {
        alert("The game is a draw!");
      } else {
        alert("Game over!");
      }
	  copyPGNButton.hidden = false;
      return true;
    }

    resignButton.addEventListener("click", () => {
      if (gameOver) return;

      if (confirm("Are you sure you want to resign?")) {
        gameOver = true;
        selectedSquare = null;
        legalTargets = [];
        renderBoard();
        alert("You resigned. Snappy wins!");
      }
    });

    newGameButton.addEventListener("click", () => {
      if (!gameOver && game.history().length > 0) {
        if (!confirm("Start a new game? Your current game will be lost.")) {
          return;
        }
      }
	
	copyPGNButton.addEventListener("click", async () => {
	  const pgn = game.pgn();
	  try {
		await navigator.clipboard.writeText(pgn);
		alert("PGN copied to clipboard!");
	  } catch (error) {
		// Fallback for browsers where Clipboard API is unavailable.
		const textarea = document.createElement("textarea");
		textarea.value = pgn;
		textarea.style.position = "fixed";const opponent = game.turn() === "w" ? "b" : "w";
		textarea.style.opacity = "0";
		document.body.appendChild(textarea);
		textarea.select();

		const copied = document.execCommand("copy");
		textarea.remove();

		if (copied) {
		  alert("PGN copied to clipboard!");
		} else {
		  alert("Unable to copy PGN. Please copy it manually:\n\n" + pgn);
		}
	  }
	});

      game.reset();
      selectedSquare = null;
      legalTargets = [];
      gameOver = false;
      thinking = false;
      renderBoard();
    });

    renderBoard();
  </script>
</body>
</html>
